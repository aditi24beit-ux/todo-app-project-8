<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#F8F7FC"/><rect x="0" y="0" width="540" height="1000" rx="0" fill="#6D28D9" stroke="none"/><text x="60" y="90" font-family="Inter,Arial,sans-serif" font-size="26" fill="white" font-weight="700">✓  TaskFlow</text><text x="60" y="390" font-family="Inter,Arial,sans-serif" font-size="42" fill="white" font-weight="700">A calmer way</text><text x="60" y="445" font-family="Inter,Arial,sans-serif" font-size="42" fill="white" font-weight="700">to get things done.</text><text x="60" y="505" font-family="Inter,Arial,sans-serif" font-size="16" fill="#E9DDFF" font-weight="400">Create your account and turn plans into progress.</text><rect x="650" y="85" width="600" height="830" rx="20" fill="white" stroke="#E9E5F2"/><text x="710" y="155" font-family="Inter,Arial,sans-serif" font-size="28" fill="#24164A" font-weight="700">Create your account</text><text x="710" y="185" font-family="Inter,Arial,sans-serif" font-size="13" fill="#77738A" font-weight="400">Start organizing your day in minutes.</text><text x="710" y="235" font-family="Inter,Arial,sans-serif" font-size="11" fill="#77738A" font-weight="600">Full name</text><rect x="710" y="245" width="480" height="40" rx="8" fill="white" stroke="#E9E5F2"/><text x="722" y="270" font-family="Inter,Arial,sans-serif" font-size="12" fill="#A09BAD" font-weight="400">Your name</text><text x="710" y="315" font-family="Inter,Arial,sans-serif" font-size="11" fill="#77738A" font-weight="600">Email address</text><rect x="710" y="325" width="480" height="40" rx="8" fill="white" stroke="#E9E5F2"/><text x="722" y="350" font-family="Inter,Arial,sans-serif" font-size="12" fill="#A09BAD" font-weight="400">you@example.com</text><text x="710" y="395" font-family="Inter,Arial,sans-serif" font-size="11" fill="#77738A" font-weight="600">Password</text><rect x="710" y="405" width="480" height="40" rx="8" fill="white" stroke="#E9E5F2"